name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release version
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; const {version}=JSON.parse(fs.readFileSync('package.json')); assert.match(version,/^\d+\.\d+\.\d+$/); assert.equal(process.env.GITHUB_REF_NAME,'v'+version)"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/nbsp1221/rillday
          tags: type=semver,pattern={{version}},suffix=-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.title=Rillday
            org.opencontainers.image.licenses=EUPL-1.2
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=rillday-${{ matrix.architecture }}

  release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          docker buildx imagetools create \
            --tag "ghcr.io/nbsp1221/rillday:$version" \
            --tag ghcr.io/nbsp1221/rillday:latest \
            "ghcr.io/nbsp1221/rillday:$version-amd64" \
            "ghcr.io/nbsp1221/rillday:$version-arm64"
      - uses: actions/download-artifact@v8
        with:
          name: rillday-windows
          path: release
      - name: Verify release files
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --generate-notes \
            release/Rillday_windows_x64_setup.exe \
            release/compose.yaml release/.env.example release/SHA256SUMS
