name: Release

on:
  push:
    tags: ['v[0-9]*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/nbsp1221/rillday

jobs:
  verify:
    if: github.event_name != 'release'
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows release files
    if: github.event_name != 'release'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop
          cache-on-failure: true
      - name: Install native license generator
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: pnpm build:desktop
      - name: Prepare Windows release files
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          node scripts/prepare-release.mjs $installers[0].FullName apps/desktop/src-tauri/target/release/rillday-desktop.exe release
      - name: Verify installation, startup and reinstallation
        shell: pwsh
        run: ./apps/desktop/tests/installer.ps1 -Installer release/Rillday_windows_x64_setup.exe -Archive release/Rillday_windows_x64.zip -OutputDirectory apps/desktop/.cache/tests/installer
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: windows-installer-test-results
          path: apps/desktop/.cache/tests/installer/result.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: rillday-windows
          path: release/
          retention-days: 7

  images:
    if: github.event_name == 'push'
    needs: verify
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      meta-images: ghcr.io/nbsp1221/rillday
      meta-tags: type=raw,value=candidate-${{ github.sha }}
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.title=Rillday
        org.opencontainers.image.licenses=EUPL-1.2
        org.opencontainers.image.version=${{ github.ref_name }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  image-tests:
    needs: images
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidate installation, recreation and recovery
        env:
          DIGEST: ${{ needs.images.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          node apps/server/tests/container/smoke.mjs "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: container-results-${{ matrix.architecture }}
          path: apps/server/.cache/tests/
          retention-days: 7

  draft:
    needs: [windows, images, image-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rillday-windows
          path: release
      - name: Verify release files
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Record the verified image
        env:
          DIGEST: ${{ needs.images.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > release/image-digest.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --notes-file release/release-notes.md \
            release/Rillday_windows_x64_setup.exe \
            release/Rillday_windows_x64.zip \
            release/compose.yaml release/example.env release/SHA256SUMS \
            release/image-digest.txt

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern image-digest.txt
          digest=$(cat image-digest.txt)
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          docker buildx imagetools create --tag "$IMAGE:${TAG#v}" "$IMAGE@$digest"
          if [ "$latest" = "$TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
          fi
