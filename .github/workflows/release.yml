name: Release

on:
  push:
    tags: ['v[0-9]*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/nbsp1221/rillday

jobs:
  verify:
    if: github.event_name != 'release'
    uses: ./.github/workflows/ci.yml

  images:
    if: github.event_name == 'push'
    needs: verify
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      meta-images: ghcr.io/nbsp1221/rillday
      meta-tags: type=raw,value=candidate-${{ github.sha }}
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.title=Rillday
        org.opencontainers.image.licenses=EUPL-1.2
        org.opencontainers.image.version=${{ github.ref_name }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  image-tests:
    needs: images
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published candidate
        env:
          DIGEST: ${{ needs.images.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          node apps/server/tests/container/smoke.mjs "$IMAGE@$DIGEST"

  draft:
    needs: [images, image-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rillday-windows
          path: release
      - name: Verify release files
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Record the verified image
        env:
          DIGEST: ${{ needs.images.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > release/image-digest.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --notes-file release/release-notes.md \
            release/Rillday_windows_x64_setup.exe \
            release/Rillday_windows_x64_portable.zip \
            release/compose.yaml release/example.env release/SHA256SUMS \
            release/image-digest.txt

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified release image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern image-digest.txt
          digest=$(cat image-digest.txt)
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          docker buildx imagetools create --tag "$IMAGE:${TAG#v}" "$IMAGE@$digest"
          if [ "$latest" = "$TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
          fi
