name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Verify generated brand assets
        run: |
          pnpm build:icons
          git diff --exit-code -- apps/web/public apps/desktop/public apps/demo/public apps/landing/public
      - run: pnpm check
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm release:check
      - name: Build browser applications once
        run: pnpm exec turbo run build --filter=@repo/web --filter=@repo/demo --filter=@repo/landing
      - uses: actions/upload-artifact@v7
        with:
          name: browser-builds
          path: |
            apps/web/dist/
            apps/demo/dist/
            apps/landing/dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: browser-builds
          path: apps
      - name: Verify web application
        run: pnpm --filter @repo/web test:e2e --shard=${{ matrix.shard }}/3
      - name: Verify demo and landing page
        if: matrix.shard == 1
        run: |
          pnpm --filter @repo/demo test:e2e
          pnpm --filter @repo/landing test:e2e
      - name: Verify shared UI contracts
        if: matrix.shard == 2
        run: pnpm --filter @repo/frontend test:browser
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            apps/web/.cache/tests/web-e2e/
            apps/demo/.cache/tests/demo/
            apps/landing/.cache/tests/landing/
            packages/frontend/.cache/tests/components/
          retention-days: 7

  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate application icon
        if: runner.os == 'Linux'
        working-directory: .
        run: pnpm build:icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - name: Install native license generator
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: .
        run: pnpm build:desktop
      - run: cargo test --locked -j 2
      - name: Prepare Windows release files
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          node scripts/prepare-release.mjs $installers[0].FullName apps/desktop/src-tauri/target/release/rillday-desktop.exe release
      - name: Verify Windows installation and reinstallation
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./apps/desktop/tests/installer.ps1 -Installer release/Rillday_windows_x64_setup.exe -Archive release/Rillday_windows_x64.zip -OutputDirectory apps/desktop/.cache/tests/installer
      - name: Build isolated Windows test application
        if: runner.os == 'Windows'
        working-directory: .
        run: pnpm --filter @repo/desktop exec tauri build --no-bundle --config tests/native/tauri.test.conf.json
      - name: Verify native Windows storage and synchronization
        if: runner.os == 'Windows'
        working-directory: .
        env:
          RILLDAY_NATIVE_EXECUTABLE: ${{ github.workspace }}\apps\desktop\src-tauri\target\release\rillday-desktop.exe
        run: pnpm --filter @repo/desktop test:native
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-test-results
          path: |
            apps/desktop/.cache/tests/installer/result.json
            apps/desktop/.cache/tests/native-report/
            apps/desktop/.cache/tests/native-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: rillday-windows
          path: release/
          retention-days: 7

  container:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: rillday:verification
          cache-from: type=gha,scope=rillday-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=rillday-${{ matrix.architecture }}
      - name: Verify installation, recreation and recovery
        run: node apps/server/tests/container/smoke.mjs rillday:verification
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: container-results-${{ matrix.architecture }}
          path: apps/server/.cache/tests/
          retention-days: 7

  web:
    needs: [checks, browser, desktop, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require checks, browser and desktop verification
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success && test "$DESKTOP_RESULT" = success && test "$CONTAINER_RESULT" = success
