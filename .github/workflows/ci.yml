name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify generated brand assets
        run: |
          pnpm build:icons
          git diff --exit-code -- apps/web/public apps/desktop/public apps/demo/public apps/landing/public
      - run: pnpm check
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm release:check

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/web/.cache/tests/web-e2e/
            apps/demo/.cache/tests/demo/
            apps/landing/.cache/tests/landing/
          retention-days: 7

  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate application icon
        if: runner.os == 'Linux'
        working-directory: .
        run: pnpm build:icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
      - run: cargo check --locked
        if: runner.os == 'Linux'
      - name: Install native license generator
        if: runner.os == 'Windows'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: .
        run: pnpm build:desktop
      - name: Prepare Windows release files
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          node scripts/prepare-release.mjs $installers[0].FullName release
      - name: Verify Windows installation and reinstallation
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./apps/desktop/tests/installer.ps1 -Installer release/Rillday_windows_x64_setup.exe -OutputDirectory apps/desktop/.cache/tests/installer
      - uses: actions/upload-artifact@v5
        if: runner.os == 'Windows'
        with:
          name: rillday-windows
          path: release/
          retention-days: 7

  container:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: rillday:verification
          cache-from: type=gha,scope=rillday-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=rillday-${{ matrix.architecture }}
      - name: Verify installation, update and recovery
        run: node apps/server/tests/container/smoke.mjs rillday:verification
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: container-results-${{ matrix.architecture }}
          path: apps/server/.cache/tests/
          retention-days: 7

  web:
    needs: [checks, browser, desktop, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require checks, browser and desktop verification
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success && test "$DESKTOP_RESULT" = success && test "$CONTAINER_RESULT" = success
